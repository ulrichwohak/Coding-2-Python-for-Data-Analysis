name: checks

on:
  push:
  pull_request:

jobs:
  course-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check lockfile
        run: uv lock --check
      - name: Sync environment
        run: uv sync --locked
      - name: Generate teaching data
        run: uv run python scripts/fetch_data.py
      - name: Check environment instructions
        run: uv run python scripts/check_no_pip.py
      - name: Check notebooks
        run: uv run python scripts/check_notebooks.py
